<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Le Monstre et la Famille Bête</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#1c1a24;--panel:#2b2233ee;--bd:#e0a85a;--tx:#fff4dc;--ac:#ffd36b}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:bold 14px 'Courier New',monospace;overflow:hidden}
#w{position:relative;width:min(100vw,calc(100vh*5/3));aspect-ratio:5/3;margin:auto;top:50%;transform:translateY(-50%)}
canvas#c{width:100%;height:100%;image-rendering:pixelated;display:block}
.p{background:var(--panel);border:3px solid var(--bd);border-radius:6px;padding:6px 9px;position:absolute}
#hearts{left:8px;top:8px;font-size:20px;color:#ff5a6e;letter-spacing:2px}
#quest{left:8px;top:46px;max-width:46%;font-size:12px}#quest b{color:var(--ac)}
#mm{right:8px;top:8px;padding:3px;line-height:0}#mm canvas{width:128px;height:96px;image-rendering:pixelated}
#inv{right:8px;top:116px;font-size:12px}
#dlg{left:5%;right:5%;bottom:12px;font-size:15px;display:none;min-height:80px}#dlg .n{color:var(--ac);margin-bottom:4px}#dlg i{position:absolute;right:10px;bottom:4px;opacity:.7;font-size:11px}
#ov{position:absolute;inset:0;background:#1c1a24f2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:12px}
#ov h1{color:var(--ac);margin:0;font-size:clamp(18px,4vw,34px)}#ov p{max-width:560px;margin:0;line-height:1.5}
button{font:inherit;background:var(--bd);color:#2b2233;border:0;border-radius:6px;padding:10px 22px;cursor:pointer}
#pad{position:absolute;left:8px;bottom:8px;display:none;gap:4px;grid-template:repeat(2,44px)/repeat(3,44px)}#pad button,#ab button{padding:0;opacity:.7}
#ab{position:absolute;right:8px;bottom:8px;display:none}#ab button{width:64px;height:64px;border-radius:50%}
@media(pointer:coarse){#pad{display:grid}#ab{display:block}}
.p{border:12px solid;border-image:var(--pn) 22 fill/12px;background:none;color:#3b2a1a;padding:0 2px;image-rendering:pixelated}
#dlg .n,#quest b{color:#8a2a1a}#hearts{color:#d6243c}#quest{top:58px}#inv{top:144px}#mm{padding:0}#mm canvas{width:136px;height:104px}
button{border:10px solid;border-image:var(--bt) 8 fill/10px;background:none;color:#3b2a1a;padding:0 14px;font-size:16px;min-width:300px;max-width:92vw;image-rendering:pixelated}button:disabled{opacity:.45;cursor:default}
#menu{display:flex;flex-direction:column;gap:2px;align-items:center}#ov{background:#1c1a24b0;z-index:4}
#toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:5;opacity:0;transition:opacity .5s;background:#1c1a24d0;border:2px solid var(--bd);padding:4px 14px;border-radius:6px;pointer-events:none;white-space:nowrap}
#pb{position:absolute;right:8px;top:196px;min-width:0;padding:0 6px}#pad button,#ab button{min-width:0;padding:0}#ab button{width:56px;height:56px;margin-left:4px}
@media(max-width:700px){#mm canvas{width:84px;height:64px}#inv{top:96px;font-size:10px}#quest{font-size:10px}button{min-width:240px;font-size:13px}#pb{top:136px}}
#mm canvas{width:140px;height:105px;cursor:pointer}#inv{top:150px}#tb{position:absolute;right:8px;top:202px;display:flex;gap:2px}#tb button{min-width:0;padding:0 6px}
#bm{position:absolute;inset:0;z-index:6;background:#101820f2;display:none}#bmc{width:100%;height:100%;touch-action:none;cursor:grab}#bmt{position:absolute;right:8px;top:8px;display:flex;gap:2px}#bmt button{min-width:0;padding:0 10px}
@media(max-width:700px){#mm canvas{width:96px;height:72px}#inv{top:112px}#tb{top:150px}}
#cin{position:absolute;inset:0;z-index:7;background:#101820d8;display:none;align-items:center;justify-content:center;cursor:pointer}
#cp{position:relative;display:flex;gap:18px;align-items:center;padding:6px 14px;max-width:92%;font-size:15px;color:#3b2a1a}#cc{width:128px;height:256px;image-rendering:pixelated;flex:none}
#ct h2{margin:0 0 4px;color:#8a2a1a;font-size:22px}#iq{height:14px;background:#6b4f3a55;position:relative;margin:6px 0;border:2px solid #3b2a1a}#iqb{position:absolute;top:0;bottom:0}#ct i{font-size:11px;opacity:.7}
@media(max-width:700px){#cc{width:64px;height:128px}#cp{font-size:12px;gap:8px}#ct h2{font-size:16px}}
</style></head><body><div id="w"><canvas id="c" width="320" height="192"></canvas>
<div class="p" id="hearts"></div><div class="p" id="quest"></div><div class="p" id="mm"><canvas id="m" width="240" height="180"></canvas></div><div class="p" id="inv"></div>
<div class="p" id="dlg"><div class="n"></div><div class="t"></div><i>[Espace] suite</i></div>
<div id="bm"><canvas id="bmc"></canvas><div id="bmt"><button onclick="bz(1.3)">＋</button><button onclick="bz(1/1.3)">－</button><button onclick="bigMap(0)">✕</button></div></div><div id="cin"><div class="p" id="cp"><canvas id="cc" width="64" height="128"></canvas><div id="ct"></div></div></div><div id="toast"></div><div id="tb"><button onclick="pauseMenu()">☰</button><button onclick="bigMap(1)">🗺</button></div><div id="pad"><span></span><button data-k="ArrowUp">▲</button><span></span><button data-k="ArrowLeft">◀</button><button data-k="ArrowDown">▼</button><button data-k="ArrowRight">▶</button></div>
<div id="ab"><button data-k="f">🐉</button><button data-k=" ">⚔</button></div>

 $('ct').innerHTML='<h2>'+d[2]+'</h2><div>'+d[1]+'</div><div>QI : <b style="color:'+(q<0?'#c0242c':'#2a7a3a')+'">'+q+'</b></div><div id="iq"><div id="iqb" style="'+(q<0?'right':'left')+':50%;width:'+Math.abs(q)/2+'%;background:'+(q<0?'#d6243c':'#3fae5a')+'"></div><div style="position:absolute;left:50%;top:0;bottom:0;width:2px;background:#3b2a1a"></div></div><div>'+d[4]+'</div><i>Espace ou clic : suivant ('+(ci+1)+'/5)</i>'}

let bs=3,bx=0,by=0,mo=0;

 REG.forEach(r=>{const x=bx+(r[1]+r[3])/2*bs,y=by+(r[2]+r[4])/2*bs;g.lineWidth=4;g.strokeStyle='#101820';g.strokeText(r[0],x,y);g.fillStyle='#ffe08a';g.fillText(r[0],x,y)});
 const q=IN?RET:P;g.fillStyle=Date.now()/300%2<1?'#fff':'#f33';g.beginPath();g.arc(bx+q.x/16*bs+bs/2,by+q.y/16*bs+bs/2,Math.max(4,bs*1.4),0,7);g.fill();g.fillStyle='#e0507a';g.beginPath();g.arc(bx+DR.x/16*bs,by+DR.y/16*bs,Math.max(3,bs),0,7);g.fill();
 }
